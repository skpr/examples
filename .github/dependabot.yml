version: 2
updates:
  - package-ecosystem: npm
    directory: "/node"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      pnpm-deps:
        patterns:
          - "*"
        update-types: [ "minor", "patch" ]
      pnpm-major-deps:
        patterns:
          - "*"
        update-types: [ "major" ]
      pnpm-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: eslint
        update-types: [ version-update:semver-major ]

  - package-ecosystem: npm
    directory: "/payload"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      pnpm-deps:
        patterns:
          - "*"
        update-types: [ "minor", "patch" ]
      pnpm-major-deps:
        patterns:
          - "*"
        update-types: [ "major" ]
      pnpm-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: eslint
        update-types: [ version-update:semver-major ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      github-actions-deps:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      github-actions-major-deps:
        patterns: [ "*" ]
        update-types: [ "major" ]
      github-actions-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
